<div class="dashboard-page">
    <div class="page-header">
        <h2 class="page-title"><i class="fa fa-tachometer-alt"></i> Dashboard</h2>
        <div class="date-filter">
            <div class="filter-field">
                <label>From</label>
                <input type="date" [(ngModel)]="fromDate" />
            </div>
            <div class="filter-field">
                <label>To</label>
                <input type="date" [(ngModel)]="toDate" />
            </div>
            <button class="btn-apply" (click)="load()">
                <i class="fa fa-search"></i> Apply
            </button>
        </div>
    </div>

    <app-skeleton-loader *ngIf="loading" type="cards" [count]="4"></app-skeleton-loader>

    <ng-container *ngIf="!loading && data">
        <div class="stat-cards">
            <app-stat-card label="Date Orders"     [value]="data.date_orders  ?? 0"               icon="fa fa-shopping-bag"  color="primary"></app-stat-card>
            <app-stat-card label="Date Sales"      [value]="(data.date_sales  ?? 0) | amount"     icon="fa fa-rupee-sign"    color="success"></app-stat-card>
            <app-stat-card label="Total Orders"    [value]="data.total_orders ?? 0"               icon="fa fa-list"          color="secondary"></app-stat-card>
            <app-stat-card label="Total Sales"     [value]="(data.total_sales ?? 0) | amount"     icon="fa fa-chart-line"    color="warning"></app-stat-card>
        </div>

        <div class="section-card">
            <h3 class="section-title"><i class="fa fa-building"></i> Branch Performance</h3>
            <div class="table-responsive" *ngIf="branches.length > 0">
                <table class="dt">
                    <thead>
                        <tr>
                            <th>Branch Name</th>
                            <th class="tr">Date Orders</th>
                            <th class="tr">Date Sales</th>
                            <th class="tr">Total Orders</th>
                            <th class="tr">Total Sales</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let b of branches">
                            <td><strong>{{ b.name ?? b.branch_name ?? '-' }}</strong></td>
                            <td class="tr">{{ b.date_orders ?? 0 }}</td>
                            <td class="tr">{{ (b.date_sales ?? 0) | amount }}</td>
                            <td class="tr">{{ b.total_orders ?? 0 }}</td>
                            <td class="tr">{{ (b.total_sales ?? 0) | amount }}</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <app-empty-state *ngIf="branches.length === 0" title="No branch data" icon="fa fa-building"></app-empty-state>
        </div>
    </ng-container>
</div>
